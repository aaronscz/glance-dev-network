# GDN app manifest (v2).
gdn: 1
id: eagles-scoreboard
version: 0.1.0
name: Sacred Heart Eagles Scoreboard
author: Ascz
description: East Grand Forks Sacred Heart Eagles - latest score and next game for every sport in season, read from a schedule file you keep.
category: Sports
entry: app.star

# Panel geometry. Height is 32 (fixed); width up to 384.
width: 192
height: 32

# High school scores land a few times a week and are typed in by hand, so a
# 15-minute refresh is plenty. Keep this in sync with FEED_TTL in app.star.
refresh: 900

# TITLE (eagle + season records / game-day banner) -> SCORES (latest result
# per sport in season) -> UPCOMING (next game per sport in season).
pages: [title, scores, upcoming]

inputs:
  - key: feedurl
    type: string
    app_input_type: free-text
    label: Schedule file URL
    help: Public link to your schedule JSON file (see README.md for the format). Leave blank to see demo data.

  - key: timezone
    type: choice
    app_input_type: dropdown
    label: Time zone
    default: "CENTRAL"
    choices: ["EASTERN", "CENTRAL", "MOUNTAIN", "PACIFIC"]
    help: Decides what counts as today. Daylight saving is applied automatically.
